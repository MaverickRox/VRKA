name: Build VRKA Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression checks
        run: |
          python -m py_compile vrka_downloader.py vrka_qml_app.py tools/generate_brand_assets.py
          python -m unittest

      - name: Prepare FFmpeg and Deno
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          New-Item -ItemType Directory -Path ffmpeg_bin, deno_bin -Force | Out-Null
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw "FFmpeg archive was incomplete." }
          Copy-Item -LiteralPath $ffmpegExe.FullName -Destination ffmpeg_bin\ffmpeg.exe
          Copy-Item -LiteralPath $ffprobeExe.FullName -Destination ffmpeg_bin\ffprobe.exe
          Copy-Item -LiteralPath (Get-Command deno).Source -Destination deno_bin\deno.exe

      - name: Build VRKA.exe
        run: python -m PyInstaller --noconfirm --clean VRKA-Windows.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" VRKA.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VRKA-3.5.0-Windows-x64
          path: installer_output/VRKA-3.5.0-setup-Windows-x64.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression checks
        run: |
          python -m py_compile vrka_downloader.py test_vrka.py test_vrka_20.py tools/generate_brand_assets.py
          python test_vrka.py
          python test_vrka_20.py

      - name: Prepare FFmpeg and Deno
        run: |
          brew install ffmpeg
          mkdir -p ffmpeg_bin deno_bin
          cp "$(command -v ffmpeg)" ffmpeg_bin/ffmpeg
          cp "$(command -v ffprobe)" ffmpeg_bin/ffprobe
          cp "$(command -v deno)" deno_bin/deno

      - name: Build VRKA.app
        run: python -m PyInstaller --noconfirm --clean VRKA-macOS.spec

      - name: Create unsigned DMG
        run: |
          mkdir -p dmg_staging
          ditto "dist/VRKA.app" "dmg_staging/VRKA.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "VRKA" -srcfolder dmg_staging -ov -format UDZO VRKA-2.0.0-build010-macOS-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VRKA-2.0.0-build010-macOS-arm64
          path: VRKA-2.0.0-build010-macOS-arm64.dmg
          if-no-files-found: error
