name: Release sanity

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sanity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reject unresolved publication placeholders
        run: |
          python -c "
          import subprocess, sys
          patterns = [
              'YOUR_GITHUB_USERNAME',
              'YOUR_SECURITY_CONTACT',
              'VERIFY_EXACT_VERSION',
              'VERIFY_EXACT_FILENAME',
              'VERIFY_EXACT_HASH',
              'YYYY-MM-DD'
          ]
          failed = False
          for p in patterns:
              res = subprocess.run(['git', 'grep', '-n', '-I', '--', p, ':!.github/workflows/*'], capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  print(f'Found placeholder {p}:\n{res.stdout}')
                  failed = True
          if failed:
              sys.exit(1)
          print('Placeholder scan passed: 0 unresolved placeholders found.')
          "

      - name: Compile source
        run: python -m compileall -q .
